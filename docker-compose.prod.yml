services:
  app:
    image: ${DOCKER_REPO:-paymybuddy}:${TAG:-latest}
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/paymybuddy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-root}
    networks:
      - paymybuddy-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_NAME:-paymybuddy}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - paymybuddy-network
    restart: unless-stopped

networks:
  paymybuddy-network:
    driver: bridge

volumes:
  mysql-data: